<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('项目提交 - 师生导师双选系统')"></head>
<body>
<nav th:replace="fragments/nav :: nav"></nav>
<div class="container pb-5">
    <h5 class="mb-3">项目提交（批阅并给出指导）</h5>
    <div class="card p-3">
        <table class="table table-hover mb-2">
            <thead><tr><th>学员</th><th>学号</th><th>项目</th><th>标题</th><th>说明</th><th>文件</th><th>大小</th><th>提交时间</th><th>操作</th></tr></thead>
            <tbody id="tb"></tbody>
        </table>
        <div id="pg" class="d-flex align-items-center"></div>
    </div>
</div>

<div class="modal fade" id="gModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title">填写指导意见</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <p class="text-secondary mb-2" id="gTarget"></p>
                <textarea id="gContent" class="form-control" rows="5" placeholder="针对该提交给出修改意见、评价或后续要求"></textarea>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="submitGuidance()">提交指导</button>
            </div>
        </div>
    </div>
</div>

<div th:replace="fragments/scripts :: scripts"></div>
<script>
var SIZE = 10, curPage = 1, gId = null, rows = [];

function load(p) {
    curPage = p || 1;
    api('/mentor/api/submissions', 'GET', {page: curPage, size: SIZE}, function (d) {
        rows = d.records;
        var html = '';
        rows.forEach(function (s) {
            html += '<tr>'
                + '<td>' + esc(s.studentName || '-') + '</td>'
                + '<td>' + esc(s.studentNo || '-') + '</td>'
                + '<td>' + esc(s.projectTitle || '-') + '</td>'
                + '<td>' + esc(s.title) + '</td>'
                + '<td>' + esc(s.description || '-') + '</td>'
                + '<td>' + esc(s.fileName) + '</td>'
                + '<td>' + fmtSize(s.fileSize) + '</td>'
                + '<td>' + (s.submitTime || '-') + '</td>'
                + '<td>'
                + '<a class="btn btn-sm btn-outline-primary me-1" href="/api/files/' + s.id + '">下载</a>'
                + '<button class="btn btn-sm btn-outline-success" onclick="openGuidance(' + s.id + ')">指导</button>'
                + '</td></tr>';
        });
        $('#tb').html(html || '<tr><td colspan="9" class="text-center text-secondary py-4">暂无数据</td></tr>');
        pager('#pg', curPage, d.total, SIZE, load);
    });
}

function openGuidance(id) {
    var s = rows.filter(function (r) { return r.id === id; })[0] || {};
    gId = id;
    $('#gTarget').text('学员：' + (s.studentName || '') + ' · 提交：' + (s.title || ''));
    $('#gContent').val('');
    new bootstrap.Modal(document.getElementById('gModal')).show();
}

function submitGuidance() {
    var content = $('#gContent').val();
    if (!content.trim()) { alert('请填写指导意见'); return; }
    api('/mentor/api/submissions/' + gId + '/guidance', 'POST', {content: content}, function () {
        bootstrap.Modal.getInstance(document.getElementById('gModal')).hide();
        alert('指导已提交');
    });
}

load(1);
</script>
</body>
</html>
