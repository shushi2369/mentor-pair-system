<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('账号管理 - 师生导师双选系统')"></head>
<body>
<nav th:replace="fragments/nav :: nav"></nav>
<div class="container pb-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0">账号管理（学员 / 导师）</h5>
        <div>
            <button class="btn btn-outline-success btn-sm me-2" data-bs-toggle="modal" data-bs-target="#importModal" onclick="prepareImport()">批量导入学员</button>
            <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#addModal" onclick="prepareAdd()">新增账号</button>
        </div>
    </div>
    <div id="importMsg" class="alert py-2 mb-3 d-none"></div>
    <div class="card p-3 mb-3">
        <div class="row g-2">
            <div class="col-md-3">
                <select id="qRole" class="form-select">
                    <option value="">全部角色</option>
                    <option value="2">导师</option>
                    <option value="3">学员</option>
                </select>
            </div>
            <div class="col-md-3"><input id="qKw" class="form-control" placeholder="登录名 / 姓名"></div>
            <div class="col-md-2"><button class="btn btn-outline-primary w-100" onclick="load(1)">查询</button></div>
        </div>
    </div>
    <div class="card p-3">
        <table class="table table-hover mb-2">
            <thead><tr><th>ID</th><th>登录名</th><th>姓名</th><th>角色</th><th>名额</th><th>联系电话</th><th>状态</th><th>创建时间</th><th>操作</th></tr></thead>
            <tbody id="tb"></tbody>
        </table>
        <div id="pg" class="d-flex align-items-center"></div>
    </div>
</div>

<div class="modal fade" id="addModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title">新增账号</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">角色</label>
                    <select id="addRole" class="form-select" onchange="toggleAddFields()">
                        <option value="3">学员</option>
                        <option value="2">导师</option>
                    </select>
                </div>
                <div class="mb-3"><label class="form-label">登录名 <span class="text-secondary" id="addNameTip">（学员=学号）</span></label>
                    <input id="addUsername" class="form-control"></div>
                <div class="mb-3"><label class="form-label">初始密码</label><input id="addPassword" class="form-control" type="text" value="123456"></div>
                <div class="mb-3"><label class="form-label">姓名</label><input id="addRealName" class="form-control"></div>
                <div class="mb-3"><label class="form-label">联系电话</label><input id="addPhone" class="form-control"></div>
                <div class="mb-3" id="addQuotaBox"><label class="form-label">可带学员名额</label><input id="addQuota" class="form-control" type="number" value="0" min="0"></div>
                <div id="addStudentBox">
                    <div class="mb-3"><label class="form-label">学号（留空则与登录名一致）</label><input id="addStudentNo" class="form-control"></div>
                    <div class="mb-3"><label class="form-label">专业</label><input id="addMajor" class="form-control"></div>
                    <div class="mb-3"><label class="form-label">班级</label><input id="addClassName" class="form-control"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="submitAdd()">保存</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title">编辑账号</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <div class="mb-3"><label class="form-label">登录名</label><input id="editUsername" class="form-control" disabled></div>
                <div class="mb-3"><label class="form-label">姓名</label><input id="editRealName" class="form-control"></div>
                <div class="mb-3"><label class="form-label">联系电话</label><input id="editPhone" class="form-control"></div>
                <div class="mb-3" id="editQuotaBox"><label class="form-label">可带学员名额</label><input id="editQuota" class="form-control" type="number" min="0"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="submitEdit()">保存</button>
            </div>
        </div>
    </div>
</div>

<!-- 批量导入学员弹窗 -->
<div class="modal fade" id="importModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title">批量导入学员</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <div class="mb-3"><label class="form-label">学员名单文件（.xls / .xlsx）</label><input type="file" id="importFile" class="form-control" accept=".xls,.xlsx"></div>
                <div class="form-text">Excel 首行表头固定为：<b>学号、姓名、密码、专业、班级</b>（一行一个学员；密码可留空，默认 123456；登录名=学号）。单次最多 1000 行。</div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-success" onclick="submitImport()">开始导入</button>
            </div>
        </div>
    </div>
</div>

<div th:replace="fragments/scripts :: scripts"></div>
<script>
var SIZE = 10, curPage = 1, rows = [], editId = null;

function load(p) {
    curPage = p || 1;
    api('/admin/api/users', 'GET', {page: curPage, size: SIZE, role: $('#qRole').val(), kw: $('#qKw').val()}, function (d) {
        rows = d.records;
        var html = '';
        rows.forEach(function (u) {
            html += '<tr>'
                + '<td>' + u.id + '</td><td>' + esc(u.username) + '</td><td>' + esc(u.realName) + '</td>'
                + '<td>' + (u.role === 2 ? '导师' : '学员') + '</td>'
                + '<td>' + (u.role === 2 ? (u.maxQuota == null ? '-' : u.maxQuota) : '-') + '</td>'
                + '<td>' + esc(u.phone || '-') + '</td>'
                + '<td>' + (u.status === 1 ? '<span class="badge bg-success">启用</span>' : '<span class="badge bg-secondary">停用</span>') + '</td>'
                + '<td>' + (u.createTime || '-') + '</td>'
                + '<td>'
                + '<button class="btn btn-sm btn-outline-primary me-1" onclick="openEdit(' + u.id + ')">编辑</button>'
                + '<button class="btn btn-sm btn-outline-' + (u.status === 1 ? 'warning' : 'success') + ' me-1" onclick="toggleStatus(' + u.id + ',' + (u.status === 1 ? 0 : 1) + ')">' + (u.status === 1 ? '停用' : '启用') + '</button>'
                + '<button class="btn btn-sm btn-outline-secondary" onclick="resetPwd(' + u.id + ')">重置密码</button>'
                + '</td></tr>';
        });
        $('#tb').html(html || '<tr><td colspan="9" class="text-center text-secondary py-4">暂无数据</td></tr>');
        pager('#pg', curPage, d.total, SIZE, load);
    });
}

function toggleAddFields() {
    var isMentor = $('#addRole').val() === '2';
    $('#addQuotaBox').toggle(isMentor);
    $('#addStudentBox').toggle(!isMentor);
    $('#addNameTip').text(isMentor ? '（导师工号 / 自定义）' : '（学员=学号）');
}

function prepareAdd() {
    $('#addRole').val('3');
    ['addUsername', 'addRealName', 'addPhone', 'addStudentNo', 'addMajor', 'addClassName'].forEach(function (id) { $('#' + id).val(''); });
    $('#addPassword').val('123456');
    $('#addQuota').val(0);
    toggleAddFields();
}

function submitAdd() {
    var role = $('#addRole').val();
    var data = {
        username: $('#addUsername').val(), password: $('#addPassword').val(),
        realName: $('#addRealName').val(), phone: $('#addPhone').val(), role: role
    };
    if (role === '2') {
        data.maxQuota = $('#addQuota').val();
    } else {
        data.studentNo = $('#addStudentNo').val();
        data.major = $('#addMajor').val();
        data.className = $('#addClassName').val();
    }
    api('/admin/api/users', 'POST', data, function () {
        bootstrap.Modal.getInstance(document.getElementById('addModal')).hide();
        load(1);
    });
}

function openEdit(id) {
    var u = rows.filter(function (r) { return r.id === id; })[0];
    if (!u) return;
    editId = id;
    $('#editUsername').val(u.username);
    $('#editRealName').val(u.realName);
    $('#editPhone').val(u.phone || '');
    $('#editQuotaBox').toggle(u.role === 2);
    $('#editQuota').val(u.maxQuota == null ? 0 : u.maxQuota);
    new bootstrap.Modal(document.getElementById('editModal')).show();
}

function submitEdit() {
    var data = {realName: $('#editRealName').val(), phone: $('#editPhone').val()};
    if ($('#editQuotaBox').is(':visible')) data.maxQuota = $('#editQuota').val();
    api('/admin/api/users/' + editId + '/update', 'POST', data, function () {
        bootstrap.Modal.getInstance(document.getElementById('editModal')).hide();
        load(curPage);
    });
}

function toggleStatus(id, status) {
    api('/admin/api/users/' + id + '/status', 'POST', {status: status}, function () { load(curPage); });
}

function resetPwd(id) {
    if (!confirm('确认重置该账号密码为 123456？')) return;
    api('/admin/api/users/' + id + '/reset-password', 'POST', {}, function () { alert('已重置为 123456'); });
}

function prepareImport() {
    $('#importFile').val('');
    $('#importMsg').addClass('d-none');
}

function submitImport() {
    var f = document.getElementById('importFile').files[0];
    if (!f) { alert('请选择 Excel 文件'); return; }
    var fd = new FormData();
    fd.append('file', f);
    api('/admin/api/users/import', 'POST', fd, function (data, msg) {
        bootstrap.Modal.getInstance(document.getElementById('importModal')).hide();
        var box = $('#importMsg').removeClass('d-none alert-info alert-danger');
        box.addClass(msg && msg.indexOf('失败 0 个') >= 0 ? 'alert-info' : 'alert-danger');
        box.text(msg);
        load(1);
    });
}

load(1);
</script>
</body>
</html>
