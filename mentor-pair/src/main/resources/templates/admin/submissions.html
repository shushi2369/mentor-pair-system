<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('项目提交 - 师生导师双选系统')"></head>
<body>
<nav th:replace="fragments/nav :: nav"></nav>
<div class="container pb-5">
    <h5 class="mb-3">项目提交管理</h5>
    <div class="card p-3">
        <table class="table table-hover mb-2">
            <thead><tr><th>ID</th><th>标题</th><th>学员</th><th>学号</th><th>导师</th><th>项目</th><th>文件</th><th>大小</th><th>提交时间</th><th>操作</th></tr></thead>
            <tbody id="tb"></tbody>
        </table>
        <div id="pg" class="d-flex align-items-center"></div>
    </div>
</div>

<div th:replace="fragments/scripts :: scripts"></div>
<script>
var SIZE = 10, curPage = 1;

function load(p) {
    curPage = p || 1;
    api('/admin/api/submissions', 'GET', {page: curPage, size: SIZE}, function (d) {
        var html = '';
        d.records.forEach(function (s) {
            html += '<tr>'
                + '<td>' + s.id + '</td>'
                + '<td>' + esc(s.title) + '<div class="text-secondary small">' + esc(s.description || '') + '</div></td>'
                + '<td>' + esc(s.studentName || '-') + '</td>'
                + '<td>' + esc(s.studentNo || '-') + '</td>'
                + '<td>' + esc(s.mentorName || '-') + '</td>'
                + '<td>' + esc(s.projectTitle || '-') + '</td>'
                + '<td>' + esc(s.fileName) + '</td>'
                + '<td>' + fmtSize(s.fileSize) + '</td>'
                + '<td>' + (s.submitTime || '-') + '</td>'
                + '<td>'
                + '<a class="btn btn-sm btn-outline-primary me-1" href="/api/files/' + s.id + '">下载</a>'
                + '<button class="btn btn-sm btn-outline-danger" onclick="del(' + s.id + ')">删除</button>'
                + '</td></tr>';
        });
        $('#tb').html(html || '<tr><td colspan="10" class="text-center text-secondary py-4">暂无数据</td></tr>');
        pager('#pg', curPage, d.total, SIZE, load);
    });
}

function del(id) {
    if (!confirm('确认删除该提交记录及其文件？')) return;
    api('/admin/api/submissions/' + id, 'DELETE', {}, function () { load(curPage); });
}

load(1);
</script>
</body>
</html>
