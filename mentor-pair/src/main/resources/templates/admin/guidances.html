<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('指导信息 - 师生导师双选系统')"></head>
<body>
<nav th:replace="fragments/nav :: nav"></nav>
<div class="container pb-5">
    <h5 class="mb-3">指导信息管理</h5>
    <div class="card p-3">
        <table class="table table-hover mb-2">
            <thead><tr><th>ID</th><th>提交标题</th><th>指导内容</th><th>学员</th><th>学号</th><th>导师</th><th>指导时间</th><th>操作</th></tr></thead>
            <tbody id="tb"></tbody>
        </table>
        <div id="pg" class="d-flex align-items-center"></div>
    </div>
</div>

<div th:replace="fragments/scripts :: scripts"></div>
<script>
var SIZE = 10, curPage = 1;

function load(p) {
    curPage = p || 1;
    api('/admin/api/guidances', 'GET', {page: curPage, size: SIZE}, function (d) {
        var html = '';
        d.records.forEach(function (g) {
            var content = g.content || '';
            var short = content.length > 40 ? content.slice(0, 40) + '…' : content;
            html += '<tr>'
                + '<td>' + g.id + '</td>'
                + '<td>' + esc(g.submissionTitle || '-') + '</td>'
                + '<td title="' + esc(content) + '">' + esc(short) + '</td>'
                + '<td>' + esc(g.studentName || '-') + '</td>'
                + '<td>' + esc(g.studentNo || '-') + '</td>'
                + '<td>' + esc(g.mentorName || '-') + '</td>'
                + '<td>' + (g.guidanceTime || '-') + '</td>'
                + '<td><button class="btn btn-sm btn-outline-danger" onclick="del(' + g.id + ')">删除</button></td>'
                + '</tr>';
        });
        $('#tb').html(html || '<tr><td colspan="8" class="text-center text-secondary py-4">暂无数据</td></tr>');
        pager('#pg', curPage, d.total, SIZE, load);
    });
}

function del(id) {
    if (!confirm('确认删除该指导记录？')) return;
    api('/admin/api/guidances/' + id, 'DELETE', {}, function () { load(curPage); });
}

load(1);
</script>
</body>
</html>
