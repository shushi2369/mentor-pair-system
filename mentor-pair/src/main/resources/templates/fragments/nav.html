<nav th:fragment="nav"
     th:classappend="${session.LOGIN_USER.role == 1} ? 'mp-navbar-admin' : (${session.LOGIN_USER.role == 2} ? 'mp-navbar-mentor' : 'mp-navbar-student')"
     class="navbar navbar-expand-lg mp-navbar mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
                <path d="M12 2 2 7l10 5 10-5-10-5zm-6.5 8.9V15c0 1.8 2.9 3.3 6.5 3.3s6.5-1.5 6.5-3.3v-4.1l-6.5 3.2-6.5-3.2zM21 9.5v5.2c0 .6.4 1 1 1s1-.4 1-1V8.2L21 9.5z"/>
            </svg>
            师生导师双选系统
            <span class="mp-role-badge"
                  th:text="${session.LOGIN_USER.role == 1} ? '管理员端' : (${session.LOGIN_USER.role == 2} ? '导师端' : '学员端')"></span>
        </a>
        <div class="navbar-nav me-auto flex-wrap" th:if="${session.LOGIN_USER != null}">
            <!-- 管理员 -->
            <a class="nav-link" th:if="${session.LOGIN_USER.role == 1}" th:href="@{/admin/dashboard}">数据总览</a>
            <a class="nav-link" th:if="${session.LOGIN_USER.role == 1}" th:href="@{/admin/window}">双选时间设置</a>
            <a class="nav-link" th:if="${session.LOGIN_USER.role == 1}" th:href="@{/admin/users}">账号管理</a>
            <a class="nav-link" th:if="${session.LOGIN_USER.role == 1}" th:href="@{/admin/projects}">项目信息</a>
            <a class="nav-link" th:if="${session.LOGIN_USER.role == 1}" th:href="@{/admin/submissions}">项目提交</a>
            <a class="nav-link" th:if="${session.LOGIN_USER.role == 1}" th:href="@{/admin/guidances}">指导信息</a>
            <!-- 导师 -->
            <a class="nav-link" th:if="${session.LOGIN_USER.role == 2}" th:href="@{/mentor/profile}">导师资料</a>
            <a class="nav-link" th:if="${session.LOGIN_USER.role == 2}" th:href="@{/mentor/projects}">我的项目</a>
            <a class="nav-link" th:if="${session.LOGIN_USER.role == 2}" th:href="@{/mentor/selections}">双选申请</a>
            <a class="nav-link" th:if="${session.LOGIN_USER.role == 2}" th:href="@{/mentor/submissions}">项目提交</a>
            <a class="nav-link" th:if="${session.LOGIN_USER.role == 2}" th:href="@{/mentor/courses}">成绩单导入</a>
            <!-- 学员 -->
            <a class="nav-link" th:if="${session.LOGIN_USER.role == 3}" th:href="@{/student/mentors}">选择导师</a>
            <a class="nav-link" th:if="${session.LOGIN_USER.role == 3}" th:href="@{/student/projects}">项目信息</a>
            <a class="nav-link" th:if="${session.LOGIN_USER.role == 3}" th:href="@{/student/selections}">我的申请</a>
            <a class="nav-link" th:if="${session.LOGIN_USER.role == 3}" th:href="@{/student/submissions}">我的提交</a>
            <a class="nav-link" th:if="${session.LOGIN_USER.role == 3}" th:href="@{/student/guidances}">我的指导</a>
        </div>
        <div class="d-flex align-items-center" th:if="${session.LOGIN_USER != null}">
            <span class="text-white me-2" th:text="${session.LOGIN_USER.realName}"></span>
            <button type="button" class="btn btn-sm btn-outline-light" onclick="openChangePassword()">修改密码</button>
            <a class="btn btn-sm btn-outline-light ms-2" th:href="@{/logout}">退出登录</a>
            <button type="button" class="btn btn-sm btn-danger ms-2" onclick="shutdownSystem()">退出系统</button>
        </div>
    </div>
</nav>

<!-- 修改密码弹窗（全局共用） -->
<div class="modal fade" id="pwdModal" tabindex="-1" th:if="${session.LOGIN_USER != null}">
    <div class="modal-dialog modal-sm">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title">修改密码</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <div class="mb-3"><label class="form-label">旧密码</label><input id="pwdOld" class="form-control" type="password"></div>
                <div class="mb-3"><label class="form-label">新密码（至少 6 位）</label><input id="pwdNew" class="form-control" type="password"></div>
                <div class="mb-1"><label class="form-label">确认新密码</label><input id="pwdConfirm" class="form-control" type="password"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="submitChangePassword()">保存</button>
            </div>
        </div>
    </div>
</div>
